repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: black
        name: black
        entry: black
        language: system
        types: [python]

      - id: ruff
        name: ruff
        entry: ruff
        args: ["check"]
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: mypy
        language: system
        files: '\.py$'
        stages: [manual]

# The mypy hook is configured as 'manual' so it won't run automatically on commits
# (pre-commit run --all-files or pre-commit run --hook-stage manual will run it).
