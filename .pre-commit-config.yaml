repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/psf/black
    rev: 23.12.0
    hooks:
      - id: black
        args: ["--line-length=100"]

  - repo: https://github.com/charliermarsh/ruff
    rev: 0.0.282
    hooks:
      - id: ruff
        args: ["check"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.0
    hooks:
      - id: mypy
        stages: [manual]

# Remote hooks are pinned to specific revisions so pre-commit can install them reproducibly.
# mypy is manual to avoid blocking commits during large typecheck runs; run it explicitly with
# `pre-commit run --hook-stage manual --all-files` or `pre-commit run --all-files` if you prefer.
