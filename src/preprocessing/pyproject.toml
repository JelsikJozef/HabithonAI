[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "habithon-preprocessing"
version = "0.2.1"
description = "Convert-only folder→Markdown tool with the mdify CLI (batch DOCX/XLSX/PDF/MSG to .md; no LLM/OCR pipeline)."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "HabithonAI" }
]
license = { text = "MIT" }
keywords = [
  "markdown",
  "converter",
  "docx",
  "pdf",
  "xlsx",
  "msg",
  "batch",
  "cli",
  "mdify",
  "convert-only"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Topic :: Text Processing :: Markup",
]
# Core package has no hard runtime deps; parser backends are optional extras.
dependencies = []

[project.optional-dependencies]
parsers = [
  "pdfminer.six>=20221105",
  "python-docx>=0.8.11",
  "extract_msg>=0.48.5",
]
# Back-compat umbrella; currently same as 'parsers'
all = [
  "pdfminer.six>=20221105",
  "python-docx>=0.8.11",
  "extract_msg>=0.48.5",
]

[project.scripts]
# New primary entry
mdify = "preprocessing.presentation.cli:main"
# Legacy entry for backward compatibility
preprocessing = "preprocessing.presentation.cli:main"

# Explicit setuptools configuration to avoid accidental discovery of sibling packages
[tool.setuptools]
include-package-data = true

# Discover from parent (src) and include only preprocessing*
[tool.setuptools.packages.find]
where = [".."]
include = ["preprocessing*"]
exclude = ["tests*"]

# Map the source root for discovery
[tool.setuptools.package-dir]
"" = ".."

# Hatch configuration remains for wheel builds
[tool.hatch.build.targets.wheel]
packages = ["preprocessing"]

[tool.hatch.version]
path = "preprocessing/__init__.py"
