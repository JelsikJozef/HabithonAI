version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  presidio:
    build:
      context: ..
      dockerfile: docker/Dockerfile.presidio
    restart: unless-stopped
    environment:
      - PRESIDIO_LANGS=${PRESIDIO_LANGS:-en:en_core_web_sm}

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
      args:
        PRELOAD_MODELS: ${PRELOAD_MODELS:-false}
    restart: unless-stopped
    environment:
      - HF_HOME=/root/.cache/huggingface
      - PRESIDIO_URL=http://presidio
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - presidio
      - qdrant

volumes:
  qdrant_data: {}
